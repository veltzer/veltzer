# Build configuration for the GitHub profile repository.
#
# There is exactly one artifact here: README.md, which GitHub renders onto the
# profile page straight from this repo's default branch. It is generated from
# README.md.in plus ../data/yaml/profiles.yaml and committed, because a push is
# the publish -- there is no deploy step that could regenerate it.
#
# That generation is deliberately NOT part of the build. The sibling ../data
# repository is private and is not checked out in CI, so making it a build
# input meant every CI run failed on a file it could never fetch. Instead
# scripts/update_from_data.py refreshes the checkout and regenerates README.md,
# run by hand after editing profiles.yaml -- the same arrangement the shared
# YAML already has in ../veltzer.github.io, whose scripts/gen_profiles.py is
# manual for exactly this reason.
#
# The build therefore only lints: the python under scripts/ and the generated
# README.md itself, so a broken link list is still caught here.

[dependencies]
pip = [
  # gen_readme.py parses the YAML source; types-PyYAML gives mypy the stubs.
  "PyYAML",
  "types-PyYAML",
  # Linters, matching the veltzer.github.io setup so the same code passes in
  # both repos. The pylint pin is load-bearing there for .pylintrc
  # compatibility; kept identical here so a shared script cannot pass one
  # checkout and fail the other.
  "pylint==3.3.8",
  "ruff",
  "mypy",
]

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

# The generated README is linted too -- it is the page people actually see, and
# a broken link list there is as bad as a broken build.
[processor.rumdl]
src_files = ["README.md"]
dep_inputs = [".rumdl.toml"]
