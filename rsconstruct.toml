# Build configuration for the GitHub profile repository.
#
# There is exactly one artifact here: README.md, which GitHub renders onto the
# profile page straight from this repo's default branch. It is generated from
# ../data/yaml/profiles.yaml and committed, because a push is the publish --
# there is no deploy step that could regenerate it.
#
# The sibling ../data repository is therefore a build input. It is not a
# submodule and is not fetched by anything here, so `rsconstruct build` fails
# with a clear message when it is absent rather than silently producing a README
# with no links.

[dependencies]
pip = [
  # gen_readme.py parses the YAML source; types-PyYAML gives mypy the stubs.
  "PyYAML",
  "types-PyYAML",
  # Linters, matching the veltzer.github.io setup so the same code passes in
  # both repos. The pylint pin is load-bearing there for .pylintrc
  # compatibility; kept identical here so a shared script cannot pass one
  # checkout and fail the other.
  "pylint==3.3.8",
  "ruff",
  "mypy",
]

# README.md is generated from README.md.in plus ../data/yaml/profiles.yaml.
#
# `explicit` rather than a src_dirs sweep: one input lives outside this
# repository and the output is a tracked file in the root, neither of which a
# directory-based processor can express. Naming both means rsconstruct rebuilds
# when either input changes and skips when neither has.
#
# The hand-written prose is in README.md.in, not in README.md behind markers,
# because rsconstruct deletes a declared output_file before regenerating it --
# which for a part-hand-written file would delete the hand-written half. Keeping
# README.md 100% generated is what makes that deletion safe.
[processor.explicit]
command = "scripts/gen_readme.py"
inputs = ["README.md.in", "../data/yaml/profiles.yaml"]
output_files = ["README.md"]

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

# The generated README is linted too -- it is the page people actually see, and
# a broken link list there is as bad as a broken build.
[processor.rumdl]
src_files = ["README.md"]
dep_inputs = [".rumdl.toml"]
